[package]
name = "clock"
version = "0.2.0"
edition = "2021"
description = "A shared clock for you and your agent — alarms and timers — cross-platform via clappkit + Tauri."
license = "Apache-2.0"

[[bin]]
name = "clock"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clappkit = { path = "../../clappkit", features = ["tauri"] }
tauri = { version = "2", features = ["image-png"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
