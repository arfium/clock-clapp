# Cut a distributable release. Push a version tag (e.g. `git tag v0.2.0 && git push
# --tags`) and this builds one `.clapp` depot per platform the manifest claims, and
# publishes them all as GitHub Release assets. End users then install with no source
# checkout:
#
#   clatch install github:<owner>/<repo>            # latest release
#   clatch install github:<owner>/<repo>@v0.2.0     # a specific tag
#
# A `.clapp` is just a zip rooted at clatch.json (reference/launch.md § Distribution),
# named `<id>-<os>-<arch>.clapp`, so we build it with `zip` — no Clatch binary needed.
# The sibling `.sha256` is the corruption check Clatch verifies on download.
#
# The depot comes from scripts/package.sh, which builds through the Tauri CLI (the
# frontend must be EMBEDDED — a plain cargo build ships a white window) and, on Windows,
# rewrites the depot manifest's connector.cliBin to `bin/clock.exe`.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write        # gh release create

jobs:
  clapp:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,       target: macos-arm64 }
          - { os: windows-latest, target: windows-x64 }
          - { os: ubuntu-22.04,   target: linux-x64   }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out clappkit beside us
        uses: actions/checkout@v4
        with:
          repository: arfium/clappkit
          path: ../clappkit
        continue-on-error: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Linux WebKit deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - run: npm ci

      - name: Build + assemble the depot → pkg/
        shell: bash
        run: scripts/package.sh

      - name: Pack the .clapp (+ sha256)
        shell: bash
        run: |
          set -eu
          id=$(node -e 'process.stdout.write(require("./clatch.json").id)')
          clapp="${id}-${{ matrix.target }}.clapp"
          ( cd pkg && 7z a -tzip -bso0 "../$clapp" . -xr'!.DS_Store' 2>/dev/null \
            || zip -r -q "../$clapp" . -x '*.DS_Store' )
          if command -v shasum >/dev/null 2>&1; then shasum -a 256 "$clapp" > "$clapp.sha256"
          else sha256sum "$clapp" > "$clapp.sha256"; fi
          echo "CLAPP=$clapp" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            || true                                   # already created by a sibling job
          gh release upload "$GITHUB_REF_NAME" "$CLAPP" "$CLAPP.sha256" --clobber
